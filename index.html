<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <title>Basketball Score Tracker</title>
  </head>
  <body>
    <div class="container">
      <div>
        <h3>Team 1</h3>
        <h1 id="Hscore">00</h1>
        <button onclick="homePointAdd(1)">+1</button>
        <button onclick="homePointAdd(2)">+2</button>
        <button onclick="homePointAdd(3)">+3</button>
      </div>
      <div>
        <h3>Team 2</h3>
        <h1 id="Gscore">00</h1>
        <button onclick="guestPointAdd(1)">+1</button>
        <button onclick="guestPointAdd(2)">+2</button>
        <button onclick="guestPointAdd(3)">+3</button>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
